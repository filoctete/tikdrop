[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tikdrop"
version = "0.1.0"
description = "TikTok Made Me Buy It - Portugal: Product Intelligence engine (scoring + profit)"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
groq = [
    "httpx>=0.27",
]
ingestion = [
    "httpx>=0.27",
    "pytrends>=4.9",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
all = [
    "tikdrop[dev,groq,ingestion,api]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tikdrop"
version = "0.1.0"
description = "TikTok Made Me Buy It - Portugal: Product Intelligence engine (scoring + profit)"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0,<3.0",
    "sqlalchemy>=2.0",
    # greenlet's wheel coverage lags behind the newest CPython releases on one side, and its
    # older releases don't compile against very new CPython internals on the other - cap it
    # only on the older interpreter (< 3.10, e.g. Windows/py3.9 here) where the newest greenlet
    # has no prebuilt wheel; leave newer interpreters (e.g. Render's Python) unpinned.
    "greenlet<3.2; python_version < '3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
groq = [
    "httpx>=0.27",
]
ingestion = [
    "httpx>=0.27",
    "pytrends>=4.9",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "psycopg[binary]>=3.1",
]
all = [
    "tikdrop[dev,groq,ingestion,api]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
